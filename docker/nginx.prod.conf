# Production web server (docker-compose.prod.yml).
# Serves the portals AND passes /api to Laravel (PHP-FPM in the "app"
# container), so the site and its API share one address:
#   https://your-domain/        the pages
#   https://your-domain/api/    the API
#   https://your-domain/storage profile photos and other public uploads
# Caddy (in front) handles HTTPS; this server is not reachable from outside.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 520M;

    # Basic browser protections for every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- API (Laravel) ----------
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Laravel's health check: https://your-domain/up
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass app:9000;
    }

    # Public uploads (profile photos), straight from Laravel's storage.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---------- Pages ----------
    # The Instructor portal used to be at /teacher/: old links still work.
    location ~ ^/teacher(?<sk_rest>/.*)?$ {
        return 301 /instructor$sk_rest$is_args$args;
    }

    # Never serve the Laravel code, its .env, deployment files, dotfiles,
    # or old copies of files (.bak, .save, .before-..., recovery, backups).
    location ^~ /backend/ { return 404; }
    location ^~ /docker/  { return 404; }
    location ~ /\.        { return 404; }
    location ~* \.(md|txt|yml|yaml|sql|sqlite|log|lock|bak|backup|save|zip|php|sh|conf|example)$ { return 404; }
    location ~* (\.bak|\.save|\.before-|\.recovery|-backup|\.orig|~$) { return 404; }

    # Clean addresses: pages open without ".html" (e.g. /instructor/class?course_id=5).
    if ($request_uri ~ "^(?<sk_folder>[^?]*/)index\.html(?:\?.*)?$") {
        return 301 $sk_folder$is_args$args;
    }
    if ($request_uri ~ "^(?<sk_page>[^?]*)\.html(?:\?.*)?$") {
        return 301 $sk_page$is_args$args;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        if (-d $request_filename) {
            rewrite [^/]$ $uri/ permanent;
        }

        add_header Cache-Control "no-cache";
        add_header Set-Cookie "sk_clean=1; Path=/; SameSite=Lax; Secure";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
