# Serves the static portals (index.html, student/, instructor/, academic-admin/, ...).
# The whole project folder is mounted here, so everything that is not a web page
# is blocked: the Laravel code and its .env, this folder, and any dotfile.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Instructor portal used to be at /teacher/: old links still work.
    location ~ ^/teacher(?<sk_rest>/.*)?$ {
        return 301 /instructor$sk_rest$is_args$args;
    }

    location ^~ /backend/ { return 404; }
    location ^~ /docker/  { return 404; }
    location ~ /\.        { return 404; }
    location ~* \.(md|txt|yml|yaml|sql|sqlite|log|lock|bak|backup|save|zip|php|sh|conf|example)$ { return 404; }
    # Old copies of files (.bak-..., .before-..., recovery, backups).
    location ~* (\.bak|\.save|\.before-|\.recovery|-backup|\.orig|~$) { return 404; }

    # Clean addresses: pages open without ".html" (e.g. /instructor/class?course_id=5),
    # and a folder's index.html opens at the folder (/instructor/). Old ".html"
    # links are sent to the clean address once. Checked against the address the
    # browser asked for, so the page lookups below cannot loop.
    if ($request_uri ~ "^(?<sk_folder>[^?]*/)index\.html(?:\?.*)?$") {
        return 301 $sk_folder$is_args$args;
    }
    if ($request_uri ~ "^(?<sk_page>[^?]*)\.html(?:\?.*)?$") {
        return 301 $sk_page$is_args$args;
    }

    # Smaller downloads: pages, styles and scripts are compressed
    # (often 70-80% smaller), which matters most on slow connections.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Images and fonts rarely change: the browser keeps them for 7 days.
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Styles and scripts: reused for 10 minutes, then checked again,
    # so updates still reach everyone quickly.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    # Pages are always checked, so a new version shows right away.
    # /instructor/class opens class.html; a folder without its "/" gets one
    # (so the page's relative links to css/ and js/ still work).
    # The sk_clean cookie tells the pages that clean addresses work here, so
    # shared/sidebar-hover.js can open them directly (no extra redirect).
    location / {
        if (-d $request_filename) {
            rewrite [^/]$ $uri/ permanent;
        }

        add_header Cache-Control "no-cache";
        add_header Set-Cookie "sk_clean=1; Path=/; SameSite=Lax";
        try_files $uri $uri.html $uri/ =404;
    }
}
