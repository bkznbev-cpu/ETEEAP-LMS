# Siknayan LMS on a hosted server (see DEPLOY.md).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# caddy  HTTPS (ports 80 and 443), the only part reachable from outside
# web    Nginx: the pages, and /api passed to Laravel
# app    Laravel API on PHP-FPM
# mysql  the database (not reachable from outside)
#
# Settings come from two untracked files:
#   .env          SITE_DOMAIN and the MySQL passwords (copy .env.example)
#   backend/.env  Laravel settings (copy backend/.env.production.example)

services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-siknayan}
      MYSQL_USER: ${MYSQL_USER:-siknayan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-siknayan}
      DB_USERNAME: ${MYSQL_USER:-siknayan}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Requests arrive through Caddy and Nginx on the Docker network:
      # trust their X-Forwarded-* headers (real visitor IP, https).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - ./backend/.env:/var/www/html/.env
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env, e.g. lms.mpsu.edu.ph}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
  app_storage:
  caddy_data:
  caddy_config:
