<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- In-page messages and questions instead of the browser's own boxes -->
    <script src="../shared/dialogs.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | MPSU ETEEAP LMS</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
</head>
<!-- My Profile is a pop-up that opens from the name in the header on
     every page (like the Academic Admin's). This page is kept for old
     links: it opens the same pop-up, and closing it returns to Classes. -->
<body data-page="profile">
    <main class="main-content" id="main"></main>

    <script src="../api-config.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/profile-modal.js"></script>
    <script>
        (function () {
            if (!window.Portal || !window.Portal.profileOverlay) return;
            window.Portal.profileOverlay.addEventListener("profileclose", () => {
                window.location.replace("./");
            });
        })();
    </script>
</body>
</html>
