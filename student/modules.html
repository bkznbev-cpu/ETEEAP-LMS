<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class | MPSU ETEEAP LMS</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        .class-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 22px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .class-info span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .module-list,
        .announcement-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* The whole card opens the module (the title link covers it);
           View and Download sit on top and work on their own. */
        .module {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            background: var(--white);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .module:hover {
            border-color: #b9d6c5;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .module:focus-within {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        .module-open::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }

        .module-open:focus {
            outline: none;
        }

        /* Clicks pass through to the card except on the buttons. */
        .module-actions {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        .module-actions button {
            pointer-events: auto;
        }

        .module-go {
            color: var(--muted);
            font-size: 16px;
        }

        .module:hover .module-go {
            color: var(--green);
        }

        .unit {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--green-soft);
            color: var(--green);
            font-weight: 700;
        }

        .module h3 {
            font-size: 16px;
        }

        .module h3 a {
            text-decoration: none;
        }

        .module:hover h3 a {
            color: var(--green);
        }

        .module p {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .module-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .module-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .announcement {
            padding: 16px 18px;
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--green);
            border-radius: 8px;
            background: var(--white);
            box-shadow: var(--shadow);
        }

        .announcement h3 {
            font-size: 15px;
        }

        /* Learning resources from the instructor */
        .resource-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .resource {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 16px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            background: var(--white);
            box-shadow: var(--shadow);
        }

        .resource-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 10px;
            font-size: 19px;
        }

        .resource-icon.link  { background: #e8efff; color: #1d4ed8; }
        .resource-icon.video { background: #fde8e8; color: #c81e1e; }
        .resource-icon.ppt   { background: #fff0e6; color: #c2410c; }
        .resource-icon.pdf   { background: #fde8ee; color: #b42318; }

        .resource-info {
            flex: 1;
            min-width: 0;
        }

        .resource-info h3 {
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .resource-info .meta {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .resource-info .text {
            margin-top: 6px;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .resource-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        @media (max-width: 640px) {
            .resource {
                flex-wrap: wrap;
            }

            .resource-actions {
                width: 100%;
            }
        }

        .announcement .meta {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .announcement .text {
            margin-top: 10px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* Replies under an announcement */
        .replies {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
        }

        .replies-title {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .reply {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            padding: 10px 0;
        }

        .reply + .reply {
            border-top: 1px dashed var(--border-light);
        }

        .reply-avatar {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--green-soft);
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
        }

        .reply.instructor .reply-avatar {
            background: var(--green);
            color: var(--white);
        }

        .reply-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
            font-size: 13px;
        }

        .reply-head time {
            color: var(--muted);
            font-size: 12px;
        }

        .reply-text {
            margin-top: 3px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .reply-delete {
            align-self: start;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .reply-delete:hover {
            background: var(--danger-soft);
            color: var(--danger);
        }

        .reply-delete:focus-visible {
            outline: 2px solid var(--green);
        }

        .reply-form {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .reply-form textarea {
            flex: 1;
            min-height: 42px;
            max-height: 160px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            line-height: 1.4;
            resize: vertical;
        }

        .reply-form textarea:focus {
            outline: 2px solid rgba(8, 104, 60, 0.22);
            border-color: var(--green);
        }

        .reply-form .btn {
            align-self: flex-end;
        }

        .reply-error {
            margin-top: 6px;
            color: var(--danger);
            font-size: 12px;
        }

        @media (max-width: 520px) {
            .reply-form {
                flex-direction: column;
            }

            .reply-form .btn {
                align-self: stretch;
            }
        }

        /* Phones: the arrow stays on the right of the card (it dropped to
           its own line), and a long file name wraps inside the card. */
        @media (max-width: 700px) {
            .module {
                grid-template-columns: auto minmax(0, 1fr) auto;
                gap: 12px;
                padding: 14px;
            }

            .module > div:not(.module-actions) {
                min-width: 0;
            }

            .module-actions {
                grid-column: auto;
                align-self: center;
                justify-content: flex-end;
            }

            .module-tags .badge {
                max-width: 100%;
                white-space: normal;
                overflow-wrap: anywhere;
                text-align: left;
            }
        }
    </style>
</head>
<body data-page="classes">
    <main class="main-content" id="main">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="./">Classes</a>
            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            <span id="crumbName">Class</span>
        </nav>

        <div class="page-header">
            <div>
                <h2 id="className">Loading class...</h2>
                <div class="class-info" id="classInfo"></div>
            </div>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="modulesPanel" id="modulesTab">
                <i class="fa-solid fa-layer-group" aria-hidden="true"></i> Modules
                <span class="count" id="moduleCount">0</span>
            </button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tab="announcementsPanel" id="announcementsTab">
                <i class="fa-solid fa-bullhorn" aria-hidden="true"></i> Announcements
                <span class="count" id="announcementCount">0</span>
            </button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tab="resourcesPanel" id="resourcesTab">
                <i class="fa-solid fa-photo-film" aria-hidden="true"></i> Learning Resources
                <span class="count" id="resourceCount">0</span>
            </button>
        </div>

        <section id="modulesPanel" role="tabpanel" aria-labelledby="modulesTab">
            <div class="module-list" id="moduleList">
                <div class="card state">
                    <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
                    <h3>Loading modules</h3>
                </div>
            </div>
        </section>

        <section id="announcementsPanel" role="tabpanel" aria-labelledby="announcementsTab" hidden>
            <div class="announcement-list" id="announcementList"></div>
        </section>

        <section id="resourcesPanel" role="tabpanel" aria-labelledby="resourcesTab" hidden>
            <div class="resource-list" id="resourceList"></div>
        </section>
    </main>

    <script src="../api-config.js"></script>
    <!-- View shows PDF, images, Word, video and audio in a new tab -->
    <script src="../instructor/js/file-viewer.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/profile-modal.js"></script>
    <script>
        (function () {
            if (!window.Portal) return;
            const { api, escape, formatDate } = window.Portal;
            const $ = id => document.getElementById(id);
            const params = new URLSearchParams(window.location.search);
            const courseId = params.get("course") || params.get("course_id");

            /* Tabs */
            function showTab(name) {
                document.querySelectorAll(".tab").forEach(tab => {
                    const active = tab.dataset.tab === name;
                    tab.classList.toggle("active", active);
                    tab.setAttribute("aria-selected", String(active));
                    $(tab.dataset.tab).hidden = !active;
                });
            }

            document.querySelectorAll(".tab").forEach(tab =>
                tab.addEventListener("click", () => showTab(tab.dataset.tab)));

            if (window.location.hash === "#announcements") showTab("announcementsPanel");

            function statusBadge(submission) {
                if (!submission) return '<span class="badge amber"><i class="fa-regular fa-clock" aria-hidden="true"></i> Not submitted</span>';
                if (submission.status === "graded" && submission.grade) {
                    const grade = submission.grade;
                    return `<span class="badge green"><i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                        Graded: ${escape(Number(grade.score))}/${escape(Number(grade.max_score))}</span>`;
                }
                return '<span class="badge"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Submitted, waiting for grade</span>';
            }

            function renderModules(modules) {
                $("moduleCount").textContent = modules.length;

                if (modules.length === 0) {
                    $("moduleList").innerHTML = `
                        <div class="card state">
                            <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
                            <h3>No modules yet</h3>
                            <p>Your instructor hasn't published any modules for this class.</p>
                        </div>`;
                    return;
                }

                $("moduleList").innerHTML = modules.map((module, index) => {
                    const href = `submission.html?module=${encodeURIComponent(module.id)}`;
                    return `
                        <article class="module">
                            <span class="unit" aria-hidden="true">${escape(module.module_order || index + 1)}</span>
                            <div>
                                <h3><a class="module-open" href="${href}"
                                    aria-label="${escape(module.title)}: ${module.my_submission ? "open" : "open and submit"}">${escape(module.title)}</a></h3>
                                ${module.description ? `<p>${escape(module.description)}</p>` : ""}
                                <div class="module-tags">
                                    ${statusBadge(module.my_submission)}
                                    ${module.has_material
                                        ? `<span class="badge"><i class="fa-solid fa-paperclip" aria-hidden="true"></i> ${escape(module.material_name || "Material attached")}</span>`
                                        : ""}
                                </div>
                            </div>
                            <div class="module-actions">
                                <i class="fa-solid fa-chevron-right module-go" aria-hidden="true"></i>
                            </div>
                        </article>`;
                }).join("");
            }

            function renderAnnouncements(items) {
                $("announcementCount").textContent = items.length;

                if (items.length === 0) {
                    $("announcementList").innerHTML = `
                        <div class="card state">
                            <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>
                            <h3>No announcements</h3>
                            <p>Announcements from your instructor will appear here.</p>
                        </div>`;
                    return;
                }

                announcements = items;
                $("announcementList").innerHTML = items.map(item => {
                    const edited = item.updated_at && item.updated_at !== item.created_at;
                    const replies = Array.isArray(item.replies) ? item.replies : [];
                    return `
                        <article class="announcement" data-announcement="${escape(item.id)}">
                            <h3>${escape(item.title)}</h3>
                            <p class="meta">${escape(item.instructor?.name || "Instructor")} · ${escape(formatDate(item.created_at))}${edited ? " · edited" : ""}</p>
                            <p class="text">${escape(item.message)}</p>

                            <div class="replies">
                                <p class="replies-title">${replies.length ? `${replies.length} repl${replies.length === 1 ? "y" : "ies"}` : "No replies yet"}</p>
                                ${replies.map(renderReply).join("")}
                                <form class="reply-form" data-reply-form="${escape(item.id)}" novalidate>
                                    <label class="visually-hidden" for="reply-${escape(item.id)}">Reply to ${escape(item.title)}</label>
                                    <textarea id="reply-${escape(item.id)}" rows="1" maxlength="2000"
                                        placeholder="Write a reply..."></textarea>
                                    <button class="btn small" type="submit">
                                        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Reply
                                    </button>
                                </form>
                                <p class="reply-error" hidden></p>
                            </div>
                        </article>`;
                }).join("");
            }

            function initialsOf(name) {
                return String(name || "?").trim().split(/\s+/).slice(0, 2)
                    .map(part => part.charAt(0).toUpperCase()).join("") || "?";
            }

            function renderReply(reply) {
                const isInstructor = reply.author?.role === "instructor";
                return `
                    <div class="reply${isInstructor ? " instructor" : ""}">
                        <span class="reply-avatar" aria-hidden="true">${escape(initialsOf(reply.author?.name))}</span>
                        <div>
                            <div class="reply-head">
                                <strong>${escape(reply.is_mine ? "You" : reply.author?.name || "Former member")}</strong>
                                ${isInstructor ? '<span class="badge green">Instructor</span>' : ""}
                                <time datetime="${escape(reply.created_at)}">${escape(formatDate(reply.created_at))}</time>
                            </div>
                            <p class="reply-text">${escape(reply.message)}</p>
                        </div>
                        ${reply.is_mine
                            ? `<button class="reply-delete" type="button" data-delete-reply="${escape(reply.id)}"
                                    title="Delete my reply" aria-label="Delete my reply">
                                    <i class="fa-solid fa-trash" aria-hidden="true"></i>
                               </button>`
                            : "<span></span>"}
                    </div>`;
            }

            let announcements = [];

            // Post a reply
            $("announcementList").addEventListener("submit", async event => {
                const form = event.target.closest("[data-reply-form]");
                if (!form) return;
                event.preventDefault();

                const box = form.querySelector("textarea");
                const button = form.querySelector("button");
                const error = form.parentElement.querySelector(".reply-error");
                const message = box.value.trim();
                error.hidden = true;

                if (!message) {
                    error.textContent = "Please write your reply.";
                    error.hidden = false;
                    box.focus();
                    return;
                }

                button.disabled = true;
                try {
                    const data = await api(`/student/announcements/${encodeURIComponent(form.dataset.replyForm)}/replies`, {
                        method: "POST",
                        body: { message }
                    });
                    const item = announcements.find(a => String(a.id) === form.dataset.replyForm);
                    if (item) item.replies = [...(item.replies || []), data.reply];
                    renderAnnouncements(announcements);
                    window.Portal.toast("Reply posted.");
                } catch (postError) {
                    error.textContent = postError.message;
                    error.hidden = false;
                    button.disabled = false;
                }
            });

            // Enter sends, Shift+Enter makes a new line.
            $("announcementList").addEventListener("keydown", event => {
                if (event.key === "Enter" && !event.shiftKey && event.target.matches(".reply-form textarea")) {
                    event.preventDefault();
                    event.target.form.requestSubmit();
                }
            });

            // Delete my reply
            $("announcementList").addEventListener("click", async event => {
                const button = event.target.closest("[data-delete-reply]");
                if (!button) return;
                if (!(await window.Portal.confirmDialog("Delete your reply?", {
                    title: "Delete reply", confirmText: "Delete", danger: true
                }))) return;

                button.disabled = true;
                try {
                    await api(`/student/announcement-replies/${encodeURIComponent(button.dataset.deleteReply)}`, { method: "DELETE" });
                    announcements.forEach(item => {
                        item.replies = (item.replies || []).filter(reply => String(reply.id) !== button.dataset.deleteReply);
                    });
                    renderAnnouncements(announcements);
                    window.Portal.toast("Reply deleted.");
                } catch (deleteError) {
                    button.disabled = false;
                    window.Portal.toast(deleteError.message, "error");
                }
            });

            /* Learning resources: links, PPT, videos from the instructor */
            let resources = [];

            function resourceKind(resource) {
                if (resource.type === "link") {
                    return /youtube\.com|youtu\.be|vimeo\.com/i.test(resource.url || "")
                        ? { icon: "fa-brands fa-youtube", label: "Video link", tone: "video" }
                        : { icon: "fa-solid fa-link", label: "Link", tone: "link" };
                }
                const ext = (String(resource.file_name || "").toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || "";
                if (["ppt", "pptx"].includes(ext)) return { icon: "fa-solid fa-file-powerpoint", label: "PowerPoint", tone: "ppt" };
                if (["mp4", "webm", "mov", "m4v"].includes(ext)) return { icon: "fa-solid fa-file-video", label: "Video", tone: "video" };
                if (["mp3", "wav"].includes(ext)) return { icon: "fa-solid fa-file-audio", label: "Audio", tone: "video" };
                if (ext === "pdf") return { icon: "fa-solid fa-file-pdf", label: "PDF", tone: "pdf" };
                return { icon: "fa-solid fa-file", label: "File", tone: "link" };
            }

            function renderResources(items) {
                resources = items;
                $("resourceCount").textContent = items.length;

                if (items.length === 0) {
                    $("resourceList").innerHTML = `
                        <div class="card state">
                            <i class="fa-solid fa-photo-film" aria-hidden="true"></i>
                            <h3>No learning resources</h3>
                            <p>Links, slides and videos from your instructor will appear here.</p>
                        </div>`;
                    return;
                }

                $("resourceList").innerHTML = items.map(item => {
                    const kind = resourceKind(item);
                    const meta = [kind.label, item.module_title ? `Module: ${escape(item.module_title)}` : "", escape(formatDate(item.created_at, false))]
                        .filter(Boolean).join(" · ");
                    const actions = item.type === "link"
                        ? `<a class="btn small" href="${escape(item.url)}" target="_blank" rel="noopener noreferrer">
                               <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> Open</a>`
                        : `<button type="button" class="btn small secondary" data-resource="${escape(item.id)}" data-inline="1">
                               <i class="fa-solid fa-eye" aria-hidden="true"></i> View</button>
                           <button type="button" class="btn small" data-resource="${escape(item.id)}">
                               <i class="fa-solid fa-download" aria-hidden="true"></i> Download</button>`;
                    return `
                        <article class="resource">
                            <span class="resource-icon ${kind.tone}"><i class="${kind.icon}" aria-hidden="true"></i></span>
                            <div class="resource-info">
                                <h3>${escape(item.title)}</h3>
                                <p class="meta">${meta}</p>
                                ${item.description ? `<p class="text">${escape(item.description)}</p>` : ""}
                            </div>
                            <div class="resource-actions">${actions}</div>
                        </article>`;
                }).join("");
            }

            $("resourceList").addEventListener("click", event => {
                const button = event.target.closest("[data-resource]");
                if (!button) return;
                const item = resources.find(resource => String(resource.id) === button.dataset.resource);
                if (!item) return;
                window.Portal.openFile(`/student/resources/${encodeURIComponent(item.id)}/file`, {
                    inline: Boolean(button.dataset.inline),
                    fileName: item.file_name || item.title
                });
            });

            function showError(message) {
                $("className").textContent = "Class not available";
                $("crumbName").textContent = "Not available";
                $("moduleList").innerHTML = `
                    <div class="card state">
                        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                        <h3>Unable to open this class</h3>
                        <p>${escape(message)}</p>
                        <a class="btn" href="./">Back to my classes</a>
                    </div>`;
            }

            async function load() {
                if (!courseId) {
                    showError("No class was selected.");
                    return;
                }

                try {
                    const { course } = await api(`/student/courses/${encodeURIComponent(courseId)}`);

                    document.title = `${course.name} | MPSU ETEEAP LMS`;
                    $("className").textContent = course.name;
                    $("crumbName").textContent = course.name;
                    $("classInfo").innerHTML = [
                        course.code && `<span><i class="fa-solid fa-hashtag" aria-hidden="true"></i>${escape(course.code)}</span>`,
                        `<span><i class="fa-solid fa-chalkboard-user" aria-hidden="true"></i>${escape(course.instructor?.name || "No instructor assigned")}</span>`,
                        course.program && `<span><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>${escape(course.program)}</span>`
                    ].filter(Boolean).join("");

                    renderModules(course.modules || []);
                    renderAnnouncements(course.announcements || []);
                    renderResources(course.resources || []);
                } catch (error) {
                    showError(error.message);
                }
            }

            load();
        })();
    </script>
</body>
</html>
