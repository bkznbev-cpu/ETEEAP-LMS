<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- In-page messages and questions instead of the browser's own boxes -->
    <script src="../shared/dialogs.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | MPSU ETEEAP LMS</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        .notice-list {
            display: flex;
            flex-direction: column;
        }

        .notice {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 14px;
            width: 100%;
            padding: 16px 18px;
            border: none;
            border-bottom: 1px solid var(--border-light);
            background: var(--white);
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .notice:last-child {
            border-bottom: none;
        }

        .notice:hover {
            background: #fafdfb;
        }

        .notice:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: -2px;
        }

        .notice.unread {
            background: #f3fbf6;
        }

        .notice-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--green-soft);
            color: var(--green);
        }

        .notice-title {
            display: block;
            font-size: 15px;
        }

        .notice.unread .notice-title {
            font-weight: 700;
        }

        .notice-text {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .notice time {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .unread-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-left: 6px;
            border-radius: 50%;
            background: var(--green);
            vertical-align: middle;
        }

        .card.flush {
            padding: 0;
            overflow: hidden;
        }

        @media (max-width: 600px) {
            .notice {
                grid-template-columns: auto 1fr;
            }

            .notice time {
                grid-column: 2;
            }
        }
    </style>
</head>
<body data-page="notifications">
    <main class="main-content" id="main">
        <div class="page-header">
            <div>
                <h2>Notifications</h2>
                <p id="summary">Loading...</p>
            </div>
            <button class="btn secondary" type="button" id="markAllButton" disabled>
                <i class="fa-solid fa-check-double" aria-hidden="true"></i> Mark all as read
            </button>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab active" type="button" role="tab" aria-selected="true" data-filter="all">
                All <span class="count" id="countAll">0</span>
            </button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-filter="unread">
                Unread <span class="count" id="countUnread">0</span>
            </button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-filter="announcement">
                Announcements
            </button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-filter="grade">
                Grades
            </button>
        </div>

        <section class="card flush">
            <div class="notice-list" id="noticeList">
                <div class="state"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i><h3>Loading notifications</h3></div>
            </div>
        </section>
    </main>

    <script src="../api-config.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/profile-modal.js"></script>
    <script>
        (function () {
            if (!window.Portal) return;
            const { api, escape, formatDate, toast, refreshBell } = window.Portal;
            const $ = id => document.getElementById(id);
            let notices = [];
            let filter = "all";

            const ICONS = {
                grade: "fa-solid fa-star",
                announcement: "fa-solid fa-bullhorn",
                submission: "fa-solid fa-paper-plane"
            };

            function render() {
                const unread = notices.filter(item => !item.is_read).length;
                $("countAll").textContent = notices.length;
                $("countUnread").textContent = unread;
                $("markAllButton").disabled = unread === 0;
                $("summary").textContent = unread
                    ? `You have ${unread} unread notification${unread === 1 ? "" : "s"}.`
                    : "You're all caught up.";

                const shown = notices.filter(item =>
                    filter === "all" ||
                    (filter === "unread" && !item.is_read) ||
                    item.type === filter);

                if (shown.length === 0) {
                    $("noticeList").innerHTML = `
                        <div class="state">
                            <i class="fa-regular fa-bell-slash" aria-hidden="true"></i>
                            <h3>No notifications here</h3>
                            <p>Announcements and grades from your instructors will appear here.</p>
                        </div>`;
                    return;
                }

                $("noticeList").innerHTML = shown.map(item => `
                    <button type="button" class="notice${item.is_read ? "" : " unread"}" data-id="${escape(item.id)}"
                        aria-label="${escape(item.title)}${item.is_read ? "" : ", unread. Mark as read"}">
                        <span class="notice-icon"><i class="${ICONS[item.type] || "fa-solid fa-bell"}" aria-hidden="true"></i></span>
                        <span>
                            <strong class="notice-title">${escape(item.title)}${item.is_read ? "" : '<span class="unread-dot" aria-hidden="true"></span>'}</strong>
                            <span class="notice-text">${escape(item.message)}</span>
                        </span>
                        <time datetime="${escape(item.created_at)}">${escape(formatDate(item.created_at))}</time>
                    </button>`).join("");
            }

            document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
                filter = tab.dataset.filter;
                document.querySelectorAll(".tab").forEach(other => {
                    other.classList.toggle("active", other === tab);
                    other.setAttribute("aria-selected", String(other === tab));
                });
                render();
            }));

            $("noticeList").addEventListener("click", async event => {
                const button = event.target.closest(".notice");
                if (!button) return;
                const notice = notices.find(item => String(item.id) === button.dataset.id);
                if (!notice || notice.is_read) return;

                try {
                    await api(`/student/notifications/${encodeURIComponent(notice.id)}/read`, { method: "POST" });
                    notice.is_read = true;
                    render();
                    refreshBell();
                } catch (error) {
                    toast(error.message, "error");
                }
            });

            $("markAllButton").addEventListener("click", async () => {
                $("markAllButton").disabled = true;
                try {
                    await api("/student/notifications/read-all", { method: "POST" });
                    notices.forEach(item => { item.is_read = true; });
                    render();
                    refreshBell();
                    toast("All notifications marked as read.");
                } catch (error) {
                    $("markAllButton").disabled = false;
                    toast(error.message, "error");
                }
            });

            async function load() {
                try {
                    const data = await api("/student/notifications");
                    notices = Array.isArray(data.notifications) ? data.notifications : [];
                    render();
                } catch (error) {
                    $("summary").textContent = "Unable to load notifications.";
                    $("noticeList").innerHTML = `
                        <div class="state">
                            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                            <h3>Unable to load notifications</h3>
                            <p>${escape(error.message)}</p>
                            <button class="btn" type="button" id="retryButton">Try again</button>
                        </div>`;
                    $("retryButton").addEventListener("click", load);
                }
            }

            load();
        })();
    </script>
</body>
</html>
