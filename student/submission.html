<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module | MPSU ETEEAP LMS</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .layout .card + .card {
            margin-top: 0;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Module page cards: coloured top line and an icon tile */
        .mcard {
            position: relative;
            overflow: hidden;
            padding-top: 26px;
            border-color: #e3ebe6;
            border-radius: 14px;
        }

        .mcard::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--mcard-accent);
        }

        .mcard .card-title {
            justify-content: flex-start;
            gap: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid #eef2ef;
        }

        .mcard-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 12px;
            background: var(--mcard-soft);
            color: var(--mcard-accent);
            font-size: 18px;
        }

        .mcard-material {
            --mcard-accent: #8b1d24;
            --mcard-soft: #fbecec;
        }

        .mcard-submit {
            --mcard-accent: #087443;
            --mcard-soft: #e5f4ec;
        }

        .mcard-grade {
            --mcard-accent: #c98a12;
            --mcard-soft: #fdf3dc;
        }

        .mcard .file-row {
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        }

        .mcard-grade .score {
            justify-content: center;
            padding: 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, #fdf6e4, #f6fbf8);
        }

        .mcard-grade .score + p {
            text-align: center;
        }

        .description {
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .file-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: #fafcfb;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .file-name i {
            color: var(--green);
            font-size: 24px;
        }

        /* Module material: red file icon on a soft red tile */
        .file-name i.material-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 10px;
            background: #fdecec;
            color: #c62828;
            font-size: 22px;
        }

        .file-name strong {
            display: block;
            overflow-wrap: anywhere;
        }

        .file-name span {
            color: var(--muted);
            font-size: 12px;
        }

        /* View and Download sit on the right of the file */
        .file-row {
            flex-wrap: nowrap;
        }

        .file-name {
            flex: 1;
        }

        .file-actions {
            display: flex;
            flex-shrink: 0;
            gap: 8px;
            margin-left: auto;
        }

        /* Phones: the file name keeps the full width (it was squeezed to a
           few letters per line); View and Download go under it. */
        @media (max-width: 600px) {
            .file-row {
                flex-wrap: wrap;
            }

            .file-name {
                flex: 1 1 100%;
            }

            .file-actions {
                flex: 1 1 100%;
                margin-left: 0;
            }

            .file-actions .file-btn {
                flex: 1 1 0;
                justify-content: center;
                height: 40px;
            }
        }

        .file-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 34px;
            padding: 0 14px;
            border: 1px solid #087443;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .file-btn.view {
            background: #e8f5ee;
            color: #087443;
        }

        .file-btn.view:hover {
            background: #087443;
            color: #fff;
        }

        .file-btn.download {
            background: #087443;
            color: #fff;
            box-shadow: 0 2px 6px rgba(8, 116, 67, 0.25);
        }

        .file-btn.download:hover {
            background: #065c36;
            border-color: #065c36;
        }

        .file-btn:hover {
            transform: translateY(-1px);
        }

        .file-btn:focus-visible {
            outline: 2px solid #e2ac2f;
            outline-offset: 2px;
        }

        /* Narrow card (Your submission): icons only, so they stay on the right */
        .mcard-submit .file-btn {
            width: 36px;
            height: 36px;
            justify-content: center;
            gap: 0;
            padding: 0;
            font-size: 0;
            line-height: 0;
        }

        .mcard-submit .file-btn i {
            width: 14px;
            font-size: 14px;
            line-height: 1;
            text-align: center;
        }

        @media (max-width: 1000px) {
            .mcard-submit .file-btn {
                width: auto;
                gap: 7px;
                padding: 0 14px;
                font-size: 13px;
                line-height: normal;
            }
        }

        @media (max-width: 520px) {
            .file-row {
                flex-wrap: wrap;
            }
        }

        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 28px 16px;
            border: 2px dashed #b9d6c5;
            border-radius: 10px;
            background: #f8fcfa;
            color: var(--muted);
            text-align: center;
            cursor: pointer;
        }

        .dropzone.dragging,
        .dropzone:hover {
            border-color: var(--green);
            background: var(--green-soft);
        }

        .dropzone:focus-within {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        .dropzone i {
            color: var(--green);
            font-size: 30px;
        }

        .dropzone strong {
            color: var(--text);
        }

        .chosen {
            color: var(--green);
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .details {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px 16px;
            margin-top: 14px;
            font-size: 13px;
        }

        .details dt {
            color: var(--muted);
        }

        .details dd {
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .score {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
        }

        .score strong {
            color: var(--green);
            font-size: 36px;
        }

        .score span {
            color: var(--muted);
        }

        .score-breakdown {
            width: 100%;
            margin-top: 12px;
            border-collapse: collapse;
            font-size: 13px;
        }

        .score-breakdown th,
        .score-breakdown td {
            padding: 8px 4px;
            border-bottom: 1px solid var(--border-light);
            text-align: left;
        }

        .score-breakdown thead th {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .score-breakdown td:last-child,
        .score-breakdown th:last-child {
            text-align: right;
            white-space: nowrap;
        }

        .score-breakdown tfoot th,
        .score-breakdown tfoot td {
            border-bottom: none;
            color: var(--green);
            font-weight: 700;
        }

        .feedback {
            margin-top: 12px;
            padding: 14px;
            border-radius: 8px;
            background: var(--green-light);
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        @media (max-width: 1000px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
        .unsubmit-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .unsubmit-note {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        p.unsubmit-note:only-child,
        #mySubmission > .unsubmit-note {
            margin-top: 12px;
        }
    </style>
</head>
<body data-page="classes">
    <main class="main-content" id="main">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="./">Classes</a>
            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            <a href="./" id="crumbClass">Class</a>
            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            <span id="crumbModule">Module</span>
        </nav>

        <div class="page-header">
            <div>
                <h2 id="moduleTitle">Loading module...</h2>
                <p id="moduleSubtitle"></p>
            </div>
            <span id="statusBadge"></span>
        </div>

        <div id="content">
            <div class="card state">
                <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
                <h3>Loading module</h3>
            </div>
        </div>
    </main>

    <template id="layoutTemplate">
        <div class="layout">
            <div class="stack">
                <section class="card mcard mcard-material">
                    <div class="card-title">
                        <span class="mcard-icon" aria-hidden="true"><i class="fa-solid fa-book-open"></i></span>
                        <div>
                            <h3>Module material</h3>
                        </div>
                    </div>
                    <div id="description"></div>
                    <div id="material"></div>
                </section>

                <section class="card mcard mcard-submit" id="submitCard" hidden>
                    <div class="card-title">
                        <span class="mcard-icon" aria-hidden="true"><i class="fa-solid fa-cloud-arrow-up"></i></span>
                        <div>
                            <h3>Submit your activity</h3>
                            <p>One file: PDF, Word, Excel or a photo (JPG, PNG), up to 10 MB. You can unsubmit it until your instructor grades it.</p>
                        </div>
                    </div>

                    <form id="submitForm" novalidate>
                        <label class="dropzone" id="dropzone">
                            <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                            <strong>Click to choose a file or drag it here</strong>
                            <span>PDF, Word, Excel or photo · Maximum 10 MB</span>
                            <span class="chosen" id="chosenFile"></span>
                            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,image/jpeg,image/png,image/webp" class="visually-hidden">
                        </label>

                        <div class="field" style="margin-top: 16px">
                            <label for="comment">Comment for your instructor (optional)</label>
                            <textarea id="comment" rows="3" maxlength="2000" placeholder="Anything your instructor should know"></textarea>
                        </div>

                        <p class="form-message error" id="submitError" hidden></p>

                        <div class="form-actions">
                            <button class="btn" type="submit" id="submitButton">
                                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                                <span>Submit activity</span>
                            </button>
                        </div>
                    </form>
                </section>
            </div>

            <div class="stack">
                <section class="card mcard mcard-submit" id="mySubmissionCard" hidden>
                    <div class="card-title">
                        <span class="mcard-icon" aria-hidden="true"><i class="fa-solid fa-paper-plane"></i></span>
                        <div>
                            <h3>Your submission</h3>
                        </div>
                    </div>
                    <div id="mySubmission"></div>
                </section>

                <section class="card mcard mcard-grade" id="gradeCard">
                    <div class="card-title">
                        <span class="mcard-icon" aria-hidden="true"><i class="fa-solid fa-star"></i></span>
                        <div>
                            <h3>Grade</h3>
                        </div>
                    </div>
                    <div id="grade"></div>
                </section>
            </div>
        </div>
    </template>

    <script src="../api-config.js"></script>
    <!-- Shows PDF and Word files in a tab instead of downloading them -->
    <script src="../instructor/js/file-viewer.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/profile-modal.js"></script>
    <script>
        (function () {
            if (!window.Portal) return;
            const { api, escape, formatDate, openFile, toast } = window.Portal;
            const $ = id => document.getElementById(id);
            const params = new URLSearchParams(window.location.search);
            const moduleId = params.get("module") || params.get("module_id") || params.get("id");

            const MAX_SIZE = 10 * 1024 * 1024;
            const ALLOWED = ["pdf", "doc", "docx", "xls", "xlsx", "jpg", "jpeg", "png", "webp"];
            let chosenFile = null;
            let currentModule = null;

            function fileRow(icon, name, sub, actions) {
                return `
                    <div class="file-row">
                        <div class="file-name">
                            <i class="${icon}" aria-hidden="true"></i>
                            <div><strong>${escape(name)}</strong>${sub ? `<span>${escape(sub)}</span>` : ""}</div>
                        </div>
                        <div class="file-actions">${actions}</div>
                    </div>`;
            }

            function fileIcon(name) {
                const extension = String(name || "").split(".").pop().toLowerCase();
                if (extension === "pdf") return "fa-solid fa-file-pdf";
                if (extension === "doc" || extension === "docx") return "fa-solid fa-file-word";
                if (extension === "xls" || extension === "xlsx") return "fa-solid fa-file-excel";
                if (["jpg", "jpeg", "png", "webp"].includes(extension)) return "fa-solid fa-file-image";
                return "fa-solid fa-file-lines";
            }

            function fileButtons(kind) {
                return `
                    <button class="file-btn view" type="button" title="View" data-file="${kind}" data-inline="1">
                        <i class="fa-solid fa-eye" aria-hidden="true"></i> View
                    </button>
                    <button class="file-btn download" type="button" title="Download" data-file="${kind}">
                        <i class="fa-solid fa-download" aria-hidden="true"></i> Download
                    </button>`;
            }

            function render(module) {
                currentModule = module;
                const submission = module.my_submission;
                const grade = submission?.grade;

                document.title = `${module.title} | MPSU ETEEAP LMS`;
                $("moduleTitle").textContent = module.title;
                $("crumbModule").textContent = module.title;
                $("crumbClass").textContent = module.course?.name || "Class";
                $("crumbClass").href = `modules.html?course=${encodeURIComponent(module.course_id)}`;
                $("moduleSubtitle").textContent = "";

                $("statusBadge").innerHTML = !submission
                    ? '<span class="badge amber"><i class="fa-regular fa-clock" aria-hidden="true"></i> Not submitted</span>'
                    : grade
                        ? '<span class="badge green"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Graded</span>'
                        : '<span class="badge"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Submitted</span>';

                $("content").innerHTML = $("layoutTemplate").innerHTML;

                $("description").innerHTML = module.description
                    ? `<p class="description" style="margin-bottom: 16px">${escape(module.description)}</p>`
                    : "";

                $("material").innerHTML = module.has_material
                    ? fileRow(`${fileIcon(module.material_name)} material-icon`, module.material_name || "Module material", "Learning material", fileButtons("material"))
                    : '<div class="state" style="padding: 20px"><i class="fa-solid fa-file-circle-xmark" aria-hidden="true"></i><p>No material is attached to this module yet.</p></div>';

                $("submitCard").hidden = Boolean(submission);
                $("mySubmissionCard").hidden = !submission;

                if (submission) {
                    $("mySubmission").innerHTML = `
                        ${fileRow("fa-solid fa-file-arrow-up", submission.file_name || "Submitted file", `Submitted ${formatDate(submission.submitted_at)}`, fileButtons("submission"))}
                        ${submission.comment ? `<dl class="details"><dt>Your comment</dt><dd>${escape(submission.comment)}</dd></dl>` : ""}
                        ${grade
                            ? '<p class="unsubmit-note"><i class="fa-solid fa-lock" aria-hidden="true"></i> Graded work can no longer be unsubmitted.</p>'
                            : `<div class="unsubmit-row">
                                <p class="unsubmit-note">Need to change your work? You can unsubmit it until your instructor grades it.</p>
                                <button class="btn danger small" type="button" id="unsubmitButton">
                                    <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> <span>Unsubmit</span>
                                </button>
                            </div>`}`;

                    $("unsubmitButton")?.addEventListener("click", unsubmit);
                }

                if (grade) {
                    $("grade").innerHTML = `
                        <div class="score">
                            <strong>${escape(Number(grade.score))} / ${escape(Number(grade.max_score))}</strong>
                            ${grade.percentage !== null ? `<span>${escape(Number(grade.percentage))}%</span>` : ""}
                        </div>
                        <p style="color: var(--muted); font-size: 13px">Graded ${escape(formatDate(grade.graded_at))}</p>
                        ${Array.isArray(grade.items) && grade.items.length ? `
                            <table class="score-breakdown">
                                <caption class="visually-hidden">Score for each activity</caption>
                                <thead><tr><th scope="col">Activity</th><th scope="col">Score</th></tr></thead>
                                <tbody>
                                    ${grade.items.map(item => `
                                        <tr>
                                            <td>${escape(item.title)}</td>
                                            <td>${escape(Number(item.score))} / ${escape(Number(item.max_score))}</td>
                                        </tr>`).join("")}
                                </tbody>
                                <tfoot><tr><th scope="row">Total</th><td>${escape(Number(grade.score))} / ${escape(Number(grade.max_score))}</td></tr></tfoot>
                            </table>` : ""}
                        ${grade.feedback
                            ? `<div class="feedback"><strong>Feedback</strong><br>${escape(grade.feedback)}</div>`
                            : '<p style="margin-top: 12px; color: var(--muted)">No feedback was given.</p>'}`;
                } else {
                    $("grade").innerHTML = `
                        <div class="state" style="padding: 20px">
                            <i class="fa-solid fa-hourglass-half" aria-hidden="true"></i>
                            <p>${submission ? "Your instructor hasn't graded this activity yet." : "Submit your activity to receive a grade."}</p>
                        </div>`;
                }

                if (!submission) setUpForm();
            }

            /* File buttons (material and own submission) */
            document.addEventListener("click", event => {
                const button = event.target.closest("[data-file]");
                if (!button || !currentModule) return;
                const inline = button.dataset.inline === "1";

                if (button.dataset.file === "material") {
                    openFile(`/student/modules/${encodeURIComponent(currentModule.id)}/material`, {
                        inline, fileName: currentModule.material_name || currentModule.title
                    });
                } else if (currentModule.my_submission) {
                    openFile(`/student/submissions/${encodeURIComponent(currentModule.my_submission.id)}/file`, {
                        inline, fileName: currentModule.my_submission.file_name || "submission"
                    });
                }
            });

            /* Submit form */
            function chooseFile(file) {
                const error = $("submitError");
                error.hidden = true;
                chosenFile = null;
                $("chosenFile").textContent = "";
                if (!file) return;

                const extension = file.name.split(".").pop().toLowerCase();
                if (!ALLOWED.includes(extension)) {
                    error.textContent = "Please choose a PDF, Word, Excel or image (JPG, PNG) file.";
                    error.hidden = false;
                    return;
                }
                if (file.size > MAX_SIZE) {
                    error.textContent = "The file is larger than 10 MB.";
                    error.hidden = false;
                    return;
                }

                chosenFile = file;
                $("chosenFile").textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            }

            function setUpForm() {
                const dropzone = $("dropzone");

                $("fileInput").addEventListener("change", event => chooseFile(event.target.files[0]));

                ["dragenter", "dragover"].forEach(type => dropzone.addEventListener(type, event => {
                    event.preventDefault();
                    dropzone.classList.add("dragging");
                }));
                ["dragleave", "drop"].forEach(type => dropzone.addEventListener(type, event => {
                    event.preventDefault();
                    dropzone.classList.remove("dragging");
                }));
                dropzone.addEventListener("drop", event => chooseFile(event.dataTransfer.files[0]));

                $("submitForm").addEventListener("submit", async event => {
                    event.preventDefault();
                    const error = $("submitError");

                    if (!chosenFile) {
                        error.textContent = "Please choose the file to submit.";
                        error.hidden = false;
                        return;
                    }

                    if (!(await window.Portal.confirmDialog(`Submit "${chosenFile.name}"?`, {
                        title: "Submit activity", confirmText: "Submit"
                    }))) return;

                    const button = $("submitButton");
                    button.disabled = true;
                    button.querySelector("span").textContent = "Submitting...";

                    const form = new FormData();
                    form.append("module_id", currentModule.id);
                    form.append("file", chosenFile);
                    const comment = $("comment").value.trim();
                    if (comment) form.append("comment", comment);

                    try {
                        await api("/student/submissions", { method: "POST", body: form });
                        toast("Activity submitted. Your instructor has been notified.");
                        await load();
                    } catch (submitError) {
                        error.textContent = submitError.message;
                        error.hidden = false;
                        button.disabled = false;
                        button.querySelector("span").textContent = "Submit activity";
                    }
                });
            }

            /* Unsubmit: take back work that has not been graded yet */
            async function unsubmit() {
                const submission = currentModule?.my_submission;
                if (!submission || submission.grade) return;

                if (!(await window.Portal.confirmDialog(
                    `Unsubmit "${submission.file_name || "your work"}"? Your file will be removed and you can submit again.`,
                    { title: "Unsubmit activity", confirmText: "Unsubmit", danger: true }
                ))) return;

                const button = $("unsubmitButton");
                button.disabled = true;
                button.querySelector("span").textContent = "Unsubmitting...";

                try {
                    await api(`/student/submissions/${encodeURIComponent(submission.id)}`, { method: "DELETE" });
                    toast("Your work was unsubmitted. You can submit again.");
                } catch (error) {
                    // For example, the instructor graded it in the meantime.
                    toast(error.message, "error");
                }
                await load();
            }

            function showError(message) {
                $("moduleTitle").textContent = "Module not available";
                $("crumbModule").textContent = "Not available";
                $("content").innerHTML = `
                    <div class="card state">
                        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                        <h3>Unable to open this module</h3>
                        <p>${escape(message)}</p>
                        <a class="btn" href="./">Back to my classes</a>
                    </div>`;
            }

            async function load() {
                if (!moduleId) {
                    showError("No module was selected.");
                    return;
                }
                try {
                    const { module } = await api(`/student/modules/${encodeURIComponent(moduleId)}`);
                    render(module);
                } catch (error) {
                    showError(error.message);
                }
            }

            load();
        })();
    </script>
</body>
</html>
