<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades | MPSU ETEEAP LMS</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        /* Class and Status filters sit on the same line as "Grades". */
        .filters {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 12px;
        }

        .filters .field {
            width: 220px;
            margin: 0;
        }

        @media (max-width: 700px) {
            .filters,
            .filters .field {
                width: 100%;
            }
        }

        /* One heading row per class, then its modules. */
        tr.class-row td {
            padding-top: 16px;
            border-bottom: 2px solid var(--green-soft);
            background: #f6fbf8;
        }

        .class-name {
            color: var(--text);
            font-weight: 700;
            text-decoration: none;
        }

        .class-name:hover {
            color: var(--green);
            text-decoration: underline;
        }

        .class-meta {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 400;
        }

        .class-average {
            text-align: right;
            white-space: nowrap;
        }

        .module-cell {
            padding-left: 28px !important;
        }

        .module-link {
            color: var(--green);
            font-weight: 600;
            text-decoration: none;
        }

        .module-link:hover {
            text-decoration: underline;
        }

        .muted {
            color: var(--muted);
            font-size: 12px;
        }

        .score-items {
            margin-top: 6px;
            padding-left: 16px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }


        @media (max-width: 700px) {
            .module-cell {
                padding-left: 14px !important;
            }
        }

        /* ---------- Phones ---------- */
        @media (max-width: 700px) {
            /* "All classes" and "All modules" on the right of "Grades". */
            .page-header {
                flex-wrap: nowrap;
                align-items: flex-start;
                gap: 10px;
            }

            .page-header > div:first-child {
                flex: 1 1 auto;
                min-width: 0;
            }

            .filters {
                flex: 0 0 46%;
                width: auto;
                max-width: 210px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .filters .field {
                width: 100%;
            }

            .filters .field label {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }

            .filters select {
                width: 100%;
                min-height: 40px;
                padding-top: 6px;
                padding-bottom: 6px;
            }

            /* The table as cards: a heading per class, then one card per
               module with its status, score and date. No sideways scrolling. */
            .table-wrap {
                overflow-x: visible;
            }

            table.data {
                min-width: 0;
            }

            table.data thead {
                display: none;
            }

            table.data,
            table.data tbody,
            table.data tr,
            table.data td {
                display: block;
                width: 100%;
            }

            table.data tr.class-row {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 12px;
                margin-top: 6px;
                padding: 12px 14px;
                border-radius: 10px;
                background: #f6fbf8;
            }

            table.data tr.class-row td {
                width: auto;
                padding: 0;
                border: 0;
                background: transparent;
            }

            table.data tr.class-row td:first-child {
                flex: 1 1 auto;
                min-width: 0;
            }

            table.data tr:not(.class-row) {
                margin: 8px 0;
                padding: 10px 14px;
                border: 1px solid var(--border-light, #e3e8e5);
                border-radius: 10px;
            }

            table.data tr:not(.class-row) td {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 4px 0 !important;
                border: 0;
                text-align: right;
            }

            table.data tr:not(.class-row) td:first-child,
            table.data td[colspan] {
                display: block;
                text-align: left;
            }

            table.data tr:not(.class-row) td:first-child:not([colspan]) {
                margin-bottom: 4px;
                padding-bottom: 8px !important;
                border-bottom: 1px solid #eef2ef;
            }

            table.data tr:not(.class-row) td:not(:first-child)::before {
                flex-shrink: 0;
                color: var(--muted);
                font-size: 12px;
                font-weight: 600;
            }

            table.data tr:not(.class-row) td:nth-child(2)::before { content: "Status"; }
            table.data tr:not(.class-row) td:nth-child(3)::before { content: "Score"; }
            table.data tr:not(.class-row) td:nth-child(4)::before { content: "Graded"; }

            .score-items {
                text-align: left;
            }
        }
    </style>
</head>
<body data-page="grades">
    <main class="main-content" id="main">
        <div class="page-header">
            <div>
                <h2>Grades</h2>
                <p>Your classes and modules, with the scores from your instructors.</p>
            </div>
            <div class="filters">
                <div class="field">
                    <label for="classFilter">Class</label>
                    <select id="classFilter">
                        <option value="">All classes</option>
                    </select>
                </div>
                <div class="field">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="">All modules</option>
                        <option value="graded">Graded</option>
                        <option value="submitted">Waiting for grade</option>
                        <option value="none">Not submitted</option>
                    </select>
                </div>
            </div>
        </div>

        <section class="card">
            <div class="table-wrap">
                <table class="data">
                    <thead>
                        <tr>
                            <th scope="col">Class / Module</th>
                            <th scope="col">Status</th>
                            <th scope="col">Score</th>
                            <th scope="col">Graded</th>
                        </tr>
                    </thead>
                    <tbody id="gradeRows">
                        <tr><td colspan="4">
                            <div class="state"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i><h3>Loading grades</h3></div>
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../api-config.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/profile-modal.js"></script>
    <script>
        (function () {
            if (!window.Portal) return;
            const { api, escape, formatDate } = window.Portal;
            const $ = id => document.getElementById(id);
            let classes = [];   // each with its modules (and the learner's submission/grade)

            const statusOf = module => {
                const submission = module.my_submission;
                if (!submission) return "none";
                return submission.grade ? "graded" : "submitted";
            };

            const percentOf = module => {
                const value = Number(module.my_submission?.grade?.percentage);
                return Number.isNaN(value) || module.my_submission?.grade?.percentage == null ? null : value;
            };

            const average = values => values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;

            function badge(module) {
                const status = statusOf(module);
                if (status === "graded") return '<span class="badge green"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Graded</span>';
                if (status === "submitted") return '<span class="badge"><i class="fa-solid fa-hourglass-half" aria-hidden="true"></i> Waiting for grade</span>';
                return '<span class="badge amber"><i class="fa-regular fa-clock" aria-hidden="true"></i> Not submitted</span>';
            }

            function percentBadge(percent) {
                if (percent === null) return "";
                const tone = percent >= 75 ? "green" : percent >= 50 ? "amber" : "red";
                return `<span class="badge ${tone}">${escape(percent)}%</span>`;
            }

            function render() {
                const classId = $("classFilter").value;
                const status = $("statusFilter").value;
                const shownClasses = classes.filter(item => !classId || String(item.id) === classId);

                if (classes.length === 0) {
                    $("gradeRows").innerHTML = `
                        <tr><td colspan="4">
                            <div class="state">
                                <i class="fa-solid fa-book-open" aria-hidden="true"></i>
                                <h3>You are not enrolled in any class yet</h3>
                            </div>
                        </td></tr>`;
                    return;
                }

                const rows = shownClasses.map(item => {
                    const modules = item.modules.filter(module => !status || statusOf(module) === status);
                    const classPercents = item.modules.map(percentOf).filter(value => value !== null);
                    const classAvg = average(classPercents);
                    const gradedCount = item.modules.filter(module => statusOf(module) === "graded").length;

                    const head = `
                        <tr class="class-row">
                            <td colspan="2">
                                <a class="class-name" href="modules.html?course=${encodeURIComponent(item.id)}">${escape(item.name)}</a>
                                <span class="class-meta">${escape([item.code, item.instructor?.name].filter(Boolean).join(" · "))}</span>
                            </td>
                            <td colspan="2" class="class-average">
                                ${classAvg === null
                                    ? '<span class="muted">No grades yet</span>'
                                    : `<strong>${classAvg.toFixed(1)}%</strong> <span class="muted">average</span>`}
                                <span class="class-meta">${gradedCount} of ${item.modules.length} module${item.modules.length === 1 ? "" : "s"} graded</span>
                            </td>
                        </tr>`;

                    if (item.error) {
                        return head + `<tr><td colspan="4" class="module-cell muted">Unable to load this class's modules. ${escape(item.error)}</td></tr>`;
                    }

                    if (modules.length === 0) {
                        return head + `<tr><td colspan="4" class="module-cell muted">${item.modules.length ? "No modules match this status." : "No modules published yet."}</td></tr>`;
                    }

                    return head + modules.map(module => {
                        const grade = module.my_submission?.grade;
                        return `
                            <tr>
                                <td class="module-cell">
                                    <a class="module-link" href="submission.html?module=${encodeURIComponent(module.id)}">${escape(module.title)}</a>
                                    ${module.my_submission?.file_name ? `<div class="muted">${escape(module.my_submission.file_name)}</div>` : ""}
                                </td>
                                <td>${badge(module)}</td>
                                <td>${grade
                                    ? `<strong>${escape(Number(grade.score))} / ${escape(Number(grade.max_score))}</strong><div style="margin-top: 4px">${percentBadge(percentOf(module))}</div>${
                                        Array.isArray(grade.items) && grade.items.length > 1
                                            ? `<ul class="score-items">${grade.items.map(item =>
                                                `<li>${escape(item.title)}: ${escape(Number(item.score))}/${escape(Number(item.max_score))}</li>`).join("")}</ul>`
                                            : ""}`
                                    : '<span class="muted">—</span>'}</td>
                                <td>${grade ? escape(formatDate(grade.graded_at, false)) : '<span class="muted">—</span>'}</td>
                            </tr>`;
                    }).join("");
                }).join("");

                $("gradeRows").innerHTML = rows;
            }

            function showError(error) {
                $("gradeRows").innerHTML = `
                    <tr><td colspan="4">
                        <div class="state">
                            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                            <h3>Unable to load your grades</h3>
                            <p>${escape(error.message)}</p>
                            <button class="btn" type="button" id="retryButton">Try again</button>
                        </div>
                    </td></tr>`;
                $("retryButton").addEventListener("click", load);
            }

            async function load() {
                try {
                    // The class list, then each class with its modules and
                    // this learner's submission and grade for each module.
                    const { courses } = await api("/student/courses");
                    const list = Array.isArray(courses) ? courses : [];

                    classes = await Promise.all(list.map(async item => {
                        try {
                            const { course } = await api(`/student/courses/${encodeURIComponent(item.id)}`);
                            return { ...item, modules: course.modules || [] };
                        } catch (error) {
                            return { ...item, modules: [], error: error.message };
                        }
                    }));

                    const previous = $("classFilter").value;
                    $("classFilter").innerHTML = '<option value="">All classes</option>' + classes
                        .map(item => `<option value="${escape(item.id)}">${escape(item.name)}${item.code ? ` (${escape(item.code)})` : ""}</option>`)
                        .join("");
                    const wanted = previous || new URLSearchParams(window.location.search).get("course") || "";
                    if (classes.some(item => String(item.id) === String(wanted))) $("classFilter").value = wanted;

                    render();
                } catch (error) {
                    showError(error);
                }
            }

            $("classFilter").addEventListener("change", render);
            $("statusFilter").addEventListener("change", render);
            load();
        })();
    </script>
</body>
</html>
