<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MPSU ETEEAP LMS - Instructor Notifications</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Existing Instructor CSS -->
    <link rel="stylesheet" href="CSS/notification.css">


    <!-- Layout fixes: keep sidebar and notification content in separate columns -->
    <style>
        :root {
            --lms-header-height: 68px;
            --lms-sidebar-width: 270px;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            width: 100%;
        }

        body {
            overflow-x: hidden;
        }

        .header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            min-height: var(--lms-header-height);
            z-index: 1000;
        }

        .app-body {
            display: flex;
            align-items: stretch;
            width: 100%;
            min-height: calc(100vh - var(--lms-header-height));
        }

        .sidebar {
            position: sticky;
            top: var(--lms-header-height);
            flex: 0 0 var(--lms-sidebar-width);
            width: var(--lms-sidebar-width);
            height: calc(100vh - var(--lms-header-height));
            min-height: 400px;
            align-self: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 20;
        }

        .sidebar .nav-menu {
            display: flex;
            flex-direction: column;
            min-height: calc(100% - 50px);
        }

        .sidebar .logout-bottom {
            margin-top: auto;
        }

        .main-content {
            position: relative;
            flex: 1 1 auto;
            width: calc(100% - var(--lms-sidebar-width));
            min-width: 0;
            margin: 0;
            padding: 28px 32px;
            overflow: hidden;
        }

        .notifications-header-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            width: 100%;
            margin-bottom: 24px;
        }

        .page-title {
            margin: 0;
        }

        .controls-row.notif-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            width: 100%;
            margin-bottom: 24px;
        }

        .filter-tabs {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
        }

        .search-wrapper {
            flex: 0 1 300px;
            width: min(100%, 300px);
            min-width: 220px;
        }

        .notifications-card-container,
        .notification-list {
            width: 100%;
            min-width: 0;
        }

        .notification-item {
            width: 100%;
            min-width: 0;
        }

        .notification-item.has-link {
            cursor: pointer;
        }

        /* Learner photo (or initials) instead of the bell */
        .learner-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e6f4ec;
            color: #0c4827;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .learner-avatar img[hidden],
        .learner-avatar span[hidden] {
            display: none;
        }

        /* Date on the same line as the title, at the right */
        .notif-title-row {
            align-items: center;
        }

        .notif-time-right {
            flex-shrink: 0;
            white-space: nowrap;
        }

        .notif-time-right .unread-dot {
            margin: 0 0 0 4px;
        }

        .notif-message {
            margin-top: 4px;
            color: #475569;
        }

        .unread-badge[hidden] {
            display: none;
        }

        @media (max-width: 520px) {
            .notif-title-row {
                flex-wrap: wrap;
            }
        }

        .notification-item.has-link:focus-visible {
            outline: 2px solid #08683c;
            outline-offset: 2px;
        }

        .notification-item.has-link:hover {
            background: #f3faf6;
        }

        .reply-icon {
            background: #fbefd2;
            color: #9a6a0a;
        }

        .profile-modal-overlay {
            z-index: 2000;
        }

        .toast-container {
            z-index: 3000;
        }

        /* Sidebar collapse */
        .sidebar.collapsed {
            flex-basis: 82px;
            width: 82px;
        }

        .main-content.expanded {
            width: calc(100% - 82px);
        }

        @media (max-width: 900px) {
            :root {
                --lms-sidebar-width: 220px;
            }

            .main-content {
                padding: 22px;
            }

            .controls-row.notif-controls {
                align-items: stretch;
            }

            .search-wrapper {
                flex-basis: 100%;
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            :root {
                --lms-sidebar-width: 72px;
            }

            .sidebar {
                min-height: calc(100vh - var(--lms-header-height));
            }

            .main-content {
                padding: 16px 12px;
            }

            .notifications-header-wrapper {
                align-items: flex-start;
            }

            .page-title {
                font-size: 22px;
            }

            .filter-tabs {
                width: 100%;
            }

            .tab-btn {
                max-width: 100%;
            }

            .search-wrapper {
                min-width: 0;
            }
        }
    </style>

    <!-- Header and sidebar shared by all Instructor pages (load last) -->
    <link rel="stylesheet" href="CSS/shell.css">
    <!-- Profile pop-up (same as the learner portal) -->
    <link rel="stylesheet" href="CSS/profile-modal.css">
    <!-- "No notifications" (and other list messages): icon and text
         centered in the list instead of sitting at the top left. -->
    <style>
        .notification-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 220px;
            padding: 30px 16px;
            color: #6b7280;
            text-align: center;
        }

        .notification-empty i {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #e8f4ed;
            color: #0b6b3e;
            font-size: 22px;
        }

        .notification-empty p {
            margin: 0;
            color: #1f2a24;
            font-size: 14px;
            font-weight: 600;
        }

        .notification-empty small {
            max-width: 280px;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        @media (max-width: 700px) {
            .notification-empty {
                min-height: 200px;
                padding: 24px 12px;
            }

            .notification-empty i {
                width: 46px;
                height: 46px;
                font-size: 19px;
            }

            .notification-empty p {
                font-size: 13.5px;
            }
        }

        /* Phones: "Mark all as read" sits on the right */
        @media (max-width: 640px) {
            .controls-row.notif-controls .mark-all-read-btn {
                margin-left: auto;
                align-self: flex-end;
            }
        }
    </style>
</head>

<script src="../api-config.js"></script>
<script>

    /* =====================================================
       API SETTINGS
       ===================================================== */

    const API_BASE_URL = window.SIKNAYAN_API_ROOT;

    const authToken =
        sessionStorage.getItem("authToken");

    let allNotifications = [];

    let currentFilter = "all";


    /* =====================================================
       SIDEBAR TOGGLE
       ===================================================== */

    const viewToggle =
        document.getElementById("viewToggle");

    const sidebar =
        document.querySelector(".sidebar");

    const mainContent =
        document.querySelector(".main-content");

    if (viewToggle) {

        viewToggle.addEventListener(
            "click",
            function () {

                sidebar.classList.toggle("collapsed");

                mainContent.classList.toggle("expanded");

            }
        );

    }


    /* =====================================================
       LOAD NOTIFICATIONS
       ===================================================== */

    async function loadNotifications() {

        const notificationList =
            document.getElementById("notificationList");

        if (!notificationList) {
            return;
        }

        if (!authToken) {

            notificationList.innerHTML = `

                <div class="notification-empty">

                    <i class="fa-solid fa-lock"></i>

                    <p>
                        Please log in again.
                    </p>

                </div>

            `;

            return;
        }

        try {

            const response = await fetch(
                `${API_BASE_URL}/instructor/notifications`,
                {
                    method: "GET",

                    headers: {
                        "Accept": "application/json",

                        "Authorization":
                            `Bearer ${authToken}`
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to load notifications."
                );

            }

            allNotifications =
                data.notifications || [];

            updateNotificationCounts();

            renderNotifications();

        }
        catch (error) {

            console.error(
                "Notification loading error:",
                error
            );

            notificationList.innerHTML = `

                <div class="notification-empty">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <p>
                        Unable to load notifications.
                    </p>

                    <small>
                        ${escapeHtml(error.message)}
                    </small>

                </div>

            `;

        }

    }


    /* =====================================================
       UPDATE NOTIFICATION COUNTS
       ===================================================== */

    function updateNotificationCounts() {

        const allCount =
            document.getElementById("allCount");

        const unreadCount =
            document.getElementById("unreadCount");

        const total =
            allNotifications.length;

        const unread =
            allNotifications.filter(
                notification =>
                    !notification.is_read
            ).length;

        if (allCount) {
            allCount.textContent = total;
        }

        // No "0" badge: the count only shows when something is unread.
        if (unreadCount) {
            unreadCount.textContent = unread > 0 ? unread : "";
            unreadCount.hidden = unread === 0;
        }

    }


    /* =====================================================
       RENDER NOTIFICATIONS
       ===================================================== */

    function renderNotifications() {

        const notificationList =
            document.getElementById(
                "notificationList"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        if (!notificationList) {
            return;
        }

        const searchText =
            searchInput
                ? searchInput.value
                    .trim()
                    .toLowerCase()
                : "";

        let filteredNotifications =
            [...allNotifications];


        if (currentFilter === "unread") {

            filteredNotifications =
                filteredNotifications.filter(
                    notification =>
                        !notification.is_read
                );

        }


        else if (
            currentFilter === "submission"
        ) {

            filteredNotifications =
                filteredNotifications.filter(
                    notification =>
                        getNotificationCategory(
                            notification
                        ) === "submission"
                );

        }


        else if (
            currentFilter === "reply"
        ) {
            filteredNotifications =
                filteredNotifications.filter(
                    notification =>
                        getNotificationCategory(
                            notification
                        ) === "reply"
                );
        }
        else if (
            currentFilter === "system"
        ) {

            filteredNotifications =
                filteredNotifications.filter(
                    notification =>
                        getNotificationCategory(
                            notification
                        ) === "system"
                );

        }


        if (searchText) {

            filteredNotifications =
                filteredNotifications.filter(
                    notification => {

                        const searchableText = [

                            notification.title || "",

                            notification.message || "",

                            notification.type || ""

                        ]
                        .join(" ")
                        .toLowerCase();

                        return searchableText.includes(
                            searchText
                        );

                    }
                );

        }


        if (
            filteredNotifications.length === 0
        ) {

            notificationList.innerHTML = `

                <div class="notification-empty">

                    <i class="fa-regular fa-bell-slash"></i>

                    <p>
                        No notifications.
                    </p>

                </div>

            `;

            return;

        }


        notificationList.innerHTML =
            filteredNotifications
                .map(
                    notification =>
                        createNotificationHTML(
                            notification
                        )
                )
                .join("");


        document
            .querySelectorAll(
                ".notification-item"
            )
            .forEach(item => {

                item.addEventListener(
                    "click",
                    function (event) {

                        if (
                            event.target.closest(
                                ".btn-action-primary"
                            ) ||
                            event.target.closest(
                                ".btn-action-secondary"
                            )
                        ) {

                            return;

                        }

                        openNotification(
                            this.dataset.notificationId
                        );
                    }
                );

                item.addEventListener(
                    "keydown",
                    function (event) {
                        if (event.key === "Enter") {
                            event.preventDefault();
                            openNotification(
                                this.dataset.notificationId
                            );
                        }
                    }
                );
            });

    }


    /* =====================================================
       WHERE A NOTIFICATION LEADS
       New submission -> that learner in the class (their
       modules and activities); learner reply -> the class
       announcements at that announcement. Older notifications
       without details go to the Submissions or Classes page.
       ===================================================== */
    function notificationLink(notification) {
        const data =
            notification && typeof notification.data === "object" && notification.data
                ? notification.data
                : {};
        const category = getNotificationCategory(notification);
        const id = value => /^\d+$/.test(String(value ?? "")) ? String(value) : "";
        const courseId = id(data.course_id);

        if (category === "submission") {
            if (courseId && id(data.learner_id)) {
                return `class-content.html?course_id=${courseId}&learner=${id(data.learner_id)}`;
            }
            return "submissions.html";
        }

        if (category === "reply") {
            if (courseId) {
                const announcement = id(data.announcement_id);
                return `class-content.html?course_id=${courseId}&tab=announcements` +
                    (announcement ? `&announcement=${announcement}` : "");
            }
            return "class.html";
        }

        return "";
    }

    async function openNotification(notificationId) {
        const notification = allNotifications.find(
            item => String(item.id) === String(notificationId)
        );
        const link = notificationLink(notification);

        // Saving "read" uses a keepalive request, which finishes even after
        // the page changes, so the instructor is taken there right away.
        if (link) {
            markNotificationAsRead(notificationId);
            window.location.href = link;
            return;
        }

        await markNotificationAsRead(notificationId);
    }

    /* =====================================================
       CREATE NOTIFICATION HTML
       ===================================================== */

    /* The learner's profile picture (or their initials) for
       notifications about a learner; a bell for the others. */
    function notificationAvatarHTML(notification) {
        const learner = notification.learner;

        if (!learner) {
            return `<div class="notif-avatar system-avatar"><i class="fa-solid fa-bell"></i></div>`;
        }

        const initials = String(learner.name || "?")
            .trim()
            .split(/\s+/)
            .slice(0, 2)
            .map(part => part.charAt(0).toUpperCase())
            .join("") || "?";

        if (learner.profile_photo_url) {
            return `
                <div class="notif-avatar learner-avatar" title="${escapeHtml(learner.name)}">
                    <img src="${escapeHtml(learner.profile_photo_url)}" alt="${escapeHtml(learner.name)}"
                        onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
                    <span hidden>${escapeHtml(initials)}</span>
                </div>`;
        }

        return `
            <div class="notif-avatar learner-avatar" title="${escapeHtml(learner.name)}">
                <span>${escapeHtml(initials)}</span>
            </div>`;
    }


    function createNotificationHTML(
        notification
    ) {

        const category =
            getNotificationCategory(
                notification
            );

        const isUnread =
            !notification.is_read;

        const readClass =
            isUnread
                ? "unread"
                : "read";

        const icon =
            getNotificationIcon(
                notification,
                category
            );

        const title =
            notification.title ||
            "Notification";

        const message =
            notification.message ||
            "";

        const createdAt =
            formatNotificationTime(
                notification.created_at
            );


        return `

            <div
                class="notification-item ${readClass}${notificationLink(notification) ? " has-link" : ""}"
                data-category="${category}"
                data-notification-id="${notification.id}"
                ${notificationLink(notification) ? 'role="link" tabindex="0"' : ""}>

                <div
                    class="notif-icon-box ${category}-icon">

                    <i class="${icon}"></i>

                </div>


                ${notificationAvatarHTML(notification)}


                <div class="notif-content">

                    <!-- Title on the left, date on the same line at the right -->
                    <div class="notif-title-row">

                        <p class="notif-text">

                            <strong>
                                ${escapeHtml(title)}
                            </strong>

                        </p>


                        <span class="notif-time notif-time-right">

                            <i class="fa-regular fa-clock"></i>

                            ${createdAt}

                            ${
                                isUnread
                                    ? `<span class="unread-dot" title="Unread"></span>`
                                    : ""
                            }

                        </span>

                    </div>


                    <p class="notif-text notif-message">
                        ${escapeHtml(message)}
                    </p>

                </div>

            </div>

        `;

    }


    /* =====================================================
       GET CATEGORY
       ===================================================== */

    function getNotificationCategory(
        notification
    ) {

        const type =
            String(
                notification.type || ""
            ).toLowerCase();

        const title =
            String(
                notification.title || ""
            ).toLowerCase();

        const message =
            String(
                notification.message || ""
            ).toLowerCase();


        if (
            type.includes("reply")
            ||
            title.startsWith("new reply")
        ) {
            return "reply";
        }

        if (
            type.includes("submission")
            ||
            title.includes("submission")
            ||
            message.includes("submitted")
        ) {
            return "submission";
        }


        return "system";

    }


    /* =====================================================
       GET ICON
       ===================================================== */

    function getNotificationIcon(
        notification,
        category
    ) {

        if (
            category === "submission"
        ) {
            return "fa-solid fa-file-arrow-up";
        }

        if (
            category === "reply"
        ) {
            return "fa-regular fa-comments";
        }


        const type =
            String(
                notification.type || ""
            ).toLowerCase();


        if (
            type.includes("message")
        ) {

            return "fa-regular fa-comment-dots";

        }


        if (
            type.includes("announcement")
        ) {

            return "fa-solid fa-bullhorn";

        }


        return "fa-solid fa-bell";

    }


    /* =====================================================
       CHECK SUBMISSION NOTIFICATION
       ===================================================== */

    function isSubmissionNotification(
        notification
    ) {

        return (
            getNotificationCategory(
                notification
            ) === "submission"
        );

    }


    /* =====================================================
       MARK ONE NOTIFICATION AS READ
       ===================================================== */

    async function markNotificationAsRead(
        notificationId
    ) {

        if (
            !notificationId ||
            !authToken
        ) {

            return;

        }


        try {

            const response =
                await fetch(

                    `${API_BASE_URL}/instructor/notifications/${notificationId}/read`,

                    {
                        method: "POST",

                        // Keeps going if the page changes (see openNotification).
                        keepalive: true,

                        headers: {

                            "Accept":
                                "application/json",

                            "Authorization":
                                `Bearer ${authToken}`

                        }

                    }

                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to mark notification as read."
                );

            }


            const notification =
                allNotifications.find(
                    item =>
                        Number(item.id) ===
                        Number(notificationId)
                );


            if (notification) {

                notification.is_read = true;

            }


            updateNotificationCounts();

            renderNotifications();

        }
        catch (error) {

            console.error(
                "Mark notification error:",
                error
            );

        }

    }


    /* =====================================================
       MARK ALL AS READ
       ===================================================== */

    const markAllReadBtn =
        document.getElementById(
            "markAllReadBtn"
        );


    if (markAllReadBtn) {

        markAllReadBtn.addEventListener(
            "click",
            async function () {

                if (!authToken) {

                    showToast(
                        "Please log in again.",
                        "error"
                    );

                    return;

                }


                try {

                    const response =
                        await fetch(

                            `${API_BASE_URL}/instructor/notifications/read-all`,

                            {
                                method: "POST",

                                headers: {

                                    "Accept":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${authToken}`

                                }

                            }

                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Unable to mark notifications as read."
                        );

                    }


                    allNotifications =
                        allNotifications.map(
                            notification => ({

                                ...notification,

                                is_read: true

                            })
                        );


                    updateNotificationCounts();

                    renderNotifications();


                    showToast(
                        "All notifications marked as read!",
                        "success"
                    );

                }
                catch (error) {

                    console.error(
                        "Mark all notifications error:",
                        error
                    );


                    showToast(
                        error.message,
                        "error"
                    );

                }

            }
        );

       ===================================================== */

        searchInput.addEventListener(

    /* =====================================================
       FORMAT NOTIFICATION TIME
       ===================================================== */

    function formatNotificationTime(
        dateValue
    ) {

        if (!dateValue) {
            return "Unknown time";
        }


        const date =
            new Date(dateValue);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Unknown time";

        }


        const now =
            new Date();


        const difference =
            Math.floor(
                (now - date) / 1000
            );


        if (
            difference < 60
        ) {

            return "Just now";

        }


        if (
            difference < 3600
        ) {

            const minutes =
                Math.floor(
                    difference / 60
                );

            return `${minutes} minute${
                minutes !== 1
                    ? "s"
                    : ""
            } ago`;

        }


        if (
            difference < 86400
        ) {

            const hours =
                Math.floor(
                    difference / 3600
                );

            return `${hours} hour${
                hours !== 1
                    ? "s"
                    : ""
            } ago`;

        }


        if (
            difference < 172800
        ) {

            return "Yesterday";

        }


        return date.toLocaleDateString(
            "en-PH",
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(
        value
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            value ?? "";

        return div.innerHTML;

    }

        );

    const avatarInput =
        document.getElementById(

    const avatarPreview =

    /* =====================================================
       TOAST
       ===================================================== */

    function showToast(
        message,
        type = "success"
    ) {

        let toastContainer =
            document.getElementById(
                "toastContainer"
            );


        if (!toastContainer) {

            toastContainer =
                document.createElement(
                    "div"
                );

            toastContainer.id =
                "toastContainer";

            toastContainer.className =
                "toast-container";

            document.body.appendChild(
                toastContainer
            );

        }


        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            `toast toast-${type}`;


        const iconClass =
            type === "success"
                ? "fa-circle-check"
                : "fa-circle-exclamation";


        toast.innerHTML = `

            <i class="fa-solid ${iconClass}"></i>

            <span>
                ${escapeHtml(message)}
            </span>

        `;


        toastContainer.appendChild(
            toast
        );


        setTimeout(
            () => {

                toast.classList.add(
                    "show"
                );

            },
            10
        );


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );


                setTimeout(
                    () => {

                        toast.remove();

                    },
                    300
                );


            },
            3500
        );

    }


    /* =====================================================
       LOAD INSTRUCTOR PROFILE
       ===================================================== */

    async function loadInstructorProfile() {

        if (!authToken) {

            showToast(
                "Please log in again.",
                "error"
            );

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/instructor/profile`,
                    {
                        method: "GET",

                        headers: {

                            "Accept":
                                "application/json",

                            "Authorization":
                                `Bearer ${authToken}`

                        }

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to load instructor profile."
                );

            }


            /*
             * IMPORTANT:
             * InstructorProfileController returns
             * the profile using "user".
             */

            const instructor =
                data.user;


            if (!instructor) {

                throw new Error(
                    "Instructor profile data was not returned."
                );

            }


            if (instructorIdInput) {

                instructorIdInput.value =
                    instructor.school_id || "";

            }


            if (instructorNameInput) {

                instructorNameInput.value =
                    instructor.name || "";

            }


            if (instructorEmailInput) {

                instructorEmailInput.value =
                    instructor.email || "";

            }


            if (instructorPhoneInput) {

                instructorPhoneInput.value =
                    instructor.contact || "";

            }


            const headerInstructorName =
                document.getElementById(
                    "headerInstructorName"
                );


            if (headerInstructorName) {

                headerInstructorName.textContent =
                    instructor.name ||
                    "Instructor";

            }


            sessionStorage.setItem(
                "user",
                JSON.stringify(instructor)
            );

        }
        catch (error) {

            console.error(
                "Profile loading error:",
                error
            );

            showToast(
                error.message,
                "error"
            );

        }

    }


    /* =====================================================
       PASSWORD ACCORDION
       ===================================================== */

    if (
        passwordToggleBtn &&
        passwordSection
    ) {

        passwordToggleBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                passwordSection.classList.toggle(
                    "open"
                );

            }
        );

    }


    /* =====================================================
       OPEN PROFILE MODAL
       ===================================================== */

    if (
        userProfileBtn &&
        profileModalOverlay
    ) {

        userProfileBtn.addEventListener(
            "click",
            async function () {

                profileModalOverlay.classList.add(
                    "active"
                );

                document.body.style.overflow =
                    "hidden";

                await loadInstructorProfile();

            }
        );

    }


    /* =====================================================
       RESET PASSWORD FIELDS
       ===================================================== */

    function resetPasswordFields() {

        if (passwordSection) {

            passwordSection.classList.remove(
                "open"
            );

        }


        if (currentPasswordInput) {

            currentPasswordInput.value =
                "";

        }


        if (newPasswordInput) {

            newPasswordInput.value =
                "";

        }


        if (confirmPasswordInput) {

            confirmPasswordInput.value =
                "";

        }

    }


    /* =====================================================
       CLOSE PROFILE MODAL
       ===================================================== */

    const closeModal = () => {

        if (profileModalOverlay) {

            profileModalOverlay.classList.remove(
                "active"
            );

        }

        document.body.style.overflow =
            "";

        resetPasswordFields();

    };


    if (closeProfileModal) {

        closeProfileModal.addEventListener(
            "click",
            closeModal
        );

    }


    if (cancelProfileModal) {

        cancelProfileModal.addEventListener(
            "click",
            closeModal
        );

    }


    if (profileModalOverlay) {

        profileModalOverlay.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    profileModalOverlay
                ) {

                    closeModal();

                }

            }
        );

    }


    /* =====================================================
       PROFILE PHOTO PREVIEW
       ===================================================== */

    if (avatarInput) {

        avatarInput.addEventListener(
            "change",
            function (event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                if (
                    file.size >
                    25 * 1024 * 1024
                ) {

                    showToast(
                        "The photo must be 25 MB or smaller.",
                        "error"
                    );

                    avatarInput.value =
                        "";

                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        if (avatarPreview) {

                            avatarPreview.src =
                                event.target.result;

                        }

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );

    }


    /* =====================================================
       SAVE INSTRUCTOR PROFILE
       ===================================================== */

    async function saveInstructorProfile() {

        if (!authToken) {

            showToast(
                "Please log in again.",
                "error"
            );

            return false;

        }


        const name =
            instructorNameInput
                ? instructorNameInput.value.trim()
                : "";

        const email =
            instructorEmailInput
                ? instructorEmailInput.value.trim()
                : "";

        const contact =
            instructorPhoneInput
                ? instructorPhoneInput.value.trim()
                : "";


        if (!name) {

            showToast(
                "Full name is required.",
                "error"
            );

            return false;

        }


        if (!email) {

            showToast(
                "Email address is required.",
                "error"
            );

            return false;

        }


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/instructor/profile`,
                    {
                        method: "PUT",

                        headers: {

                            "Accept":
                                "application/json",

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${authToken}`

                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            contact: contact

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                if (data.errors) {

                    const firstError =
                        Object.values(
                            data.errors
                        )[0]?.[0];

                    throw new Error(
                        firstError ||
                        "Unable to update profile."
                    );

                }


                throw new Error(
                    data.message ||
                    "Unable to update profile."
                );

            }


            /*
             * InstructorProfileController returns
             * the updated data using "user".
             */

            if (data.user) {

                sessionStorage.setItem(
                    "user",
                    JSON.stringify(
                        data.user
                    )
                );


                if (headerInstructorName) {

                    headerInstructorName.textContent =
                        data.user.name;

                }

            }


            return true;

        }
        catch (error) {

            console.error(
                "Profile update error:",
                error
            );

            showToast(
                error.message,
                "error"
            );

            return false;

        }

    }


    /* =====================================================
       CHANGE PASSWORD
       ===================================================== */

    async function changeInstructorPassword() {

        const currentPassword =
            currentPasswordInput
                ? currentPasswordInput.value.trim()
                : "";

        const newPassword =
            newPasswordInput
                ? newPasswordInput.value.trim()
                : "";

        const confirmPassword =
            confirmPasswordInput
                ? confirmPasswordInput.value.trim()
                : "";


        const changingPassword =
            currentPassword ||
            newPassword ||
            confirmPassword;


        /*
         * Password section is optional.
         * If all fields are empty, do nothing.
         */

        if (!changingPassword) {

            return true;

        }


        if (!currentPassword) {

            showToast(
                "Please enter your current password.",
                "error"
            );

            return false;

        }


        if (
            !newPassword ||
            newPassword.length < 8
        ) {

            showToast(
                "New password must be at least 8 characters.",
                "error"
            );

            return false;

        }


        if (
            newPassword !==
            confirmPassword
        ) {

            showToast(
                "New passwords do not match.",
                "error"
            );

            return false;

        }


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/instructor/profile/password`,
                    {
                        /*
                         * IMPORTANT:
                         * Controller uses POST.
                         */

                        method: "POST",

                        headers: {

                            "Accept":
                                "application/json",

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${authToken}`

                        },

                        body: JSON.stringify({

                            current_password:
                                currentPassword,

                            /*
                             * IMPORTANT:
                             * Controller expects new_password.
                             */

                            new_password:
                                newPassword,

                            new_password_confirmation:
                                confirmPassword

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                if (data.errors) {

                    const firstError =
                        Object.values(
                            data.errors
                        )[0]?.[0];

                    throw new Error(
                        firstError ||
                        "Unable to change password."
                    );

                }


                throw new Error(
                    data.message ||
                    "Unable to change password."
                );

            }


            showToast(
                "Password changed successfully.",
                "success"
            );


            return true;

        }
        catch (error) {

            console.error(
                "Password change error:",
                error
            );

            showToast(
                error.message,
                "error"
            );

            return false;

        }

    }


    /* =====================================================
       PROFILE FORM SUBMIT
       ===================================================== */

    if (profileForm) {

        profileForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /*
                 * First save profile information.
                 */

                const profileSaved =
                    await saveInstructorProfile();


                if (!profileSaved) {
                    return;
                }


                /*
                 * Then change password if the
                 * password fields were filled.
                 */

                const passwordChanged =
                    await changeInstructorPassword();


                if (!passwordChanged) {
                    return;
                }


                /*
                 * Update avatar preview locally.
                 *
                 * Avatar is NOT saved to the database yet.
                 */

                if (
                    headerAvatar &&
                    avatarPreview
                ) {

                    headerAvatar.src =
                        avatarPreview.src;

                }


                showToast(
                    "Profile settings saved successfully!",
                    "success"
                );


                setTimeout(
                    () => {

                        closeModal();

                    },
                    500
                );

            }
        );

    }


    /* =====================================================
       PAGE LOAD
       ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadInstructorProfile();

            loadNotifications();

        }
    );
