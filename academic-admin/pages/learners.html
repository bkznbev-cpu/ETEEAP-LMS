<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- In-page messages and questions instead of the browser's own boxes -->
    <script src="../../shared/dialogs.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Siknayan | Learners</title>

    <link rel="stylesheet" href="../css/style.css">
    <!-- MPSU look: header art, sidebar (load after style.css) -->
    <link rel="stylesheet" href="../css/theme.css">

    <script src="../../shared/lucide-icons.js"></script>
</head>

<body>

    <!-- =========================
         TOP HEADER
    ========================== -->
    <header class="topbar">

        <div class="brand">
            <img
                src="../assets/images/logo.png"
                alt="MPSU Logo"
                class="brand-logo"
            >

            <div class="brand-text">
                <h1>MPSU ETEEAP LMS</h1>
                <p>Mountain Province State University</p>
            </div>
        </div>

        <div class="topbar-right">

            <button class="icon-button notification-button">
                <i data-lucide="bell"></i>
                <span class="notification-dot"></span>
            </button>

            
<div class="profile">
    <img
        alt="Academic Admin profile picture"
        class="profile-avatar"
        style="visibility: hidden"
    >

    <div class="profile-info">
        <strong id="topbarAdminName"></strong>
        <span>Administrator</span>
    </div>
</div>


                <i
                    data-lucide="chevron-down"
                    class="profile-chevron"
                ></i>
            </div>

        </div>

    </header>


    <!-- =========================
         APPLICATION LAYOUT
    ========================== -->
    <div class="app-layout">

        <!-- =====================
             SIDEBAR
        ====================== -->
        <aside class="sidebar" id="sidebar">

            <div class="sidebar-top">

                <span class="sidebar-view-text">
                    View
                </span>

                <button
                    class="sidebar-toggle"
                    id="sidebarToggle"
                    aria-label="Toggle sidebar"
                >
                    <i data-lucide="panel-left"></i>
                </button>

            </div>



<!-- Sidebar Profile -->
<div
    class="sidebar-profile"
    id="sidebarAdminProfile"
    role="button"
    tabindex="0"
    aria-label="Open profile settings"
>
    <img
        alt="Academic Admin profile picture"
        class="sidebar-avatar"
        style="visibility: hidden"
    >

    <span class="sidebar-profile-name" id="sidebarAdminName">
    </span>
</div>


            <!-- Navigation -->
            <nav class="sidebar-nav">

                <a href="../index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span class="nav-label">Dashboard</span>
                </a>

                <a href="learners.html" class="nav-item active">
                    <i data-lucide="users"></i>
                    <span class="nav-label">Learners</span>
                </a>

                <a href="classes.html" class="nav-item">
                    <i data-lucide="book-open"></i>
                    <span class="nav-label">Classes</span>
                </a>
                
                <a href="module-library.html" class="nav-item">
                    <i data-lucide="folder"></i>
                    <span class="nav-label">Module Library</span>
                </a>

                <a href="#" class="nav-item">
                    <i data-lucide="circle-user-round"></i>
                    <span class="nav-label">Accounts</span>
                </a>

                <a href="#" class="nav-item">
                    <i data-lucide="pie-chart"></i>
                    <span class="nav-label">Reports</span>
                </a>

                <a href="#" class="nav-item">
                    <i data-lucide="bell"></i>
                    <span class="nav-label">Notifications</span>
                </a>

            </nav>


            <!-- Logout -->
           <div class="sidebar-bottom">
    <a
        href="#"
        class="nav-item logout"
        id="academicAdminLogoutBtn"
    >
        <i data-lucide="log-out"></i>
        <span class="nav-label">Logout</span>
    </a>
</div>

        </aside>


        <!-- =====================
             MAIN CONTENT
        ====================== -->
        <main class="main-content learners-page">

            <!-- Page heading: title on the left; search in the center with
                 the program and status dropdowns beside it -->
            <section class="learners-heading">

                <h2>Learners</h2>

                <div class="learner-controls">

                    <div class="search-box">

                        <i data-lucide="search"></i>

                        <input
                            type="text"
                            id="learnerSearch"
                            placeholder="Search by learner name..."
                        >

                    </div>

                    <div class="filter-group">

                        <select id="programFilter">
                        </select>

                        <select id="statusFilter">
                            <option value="all">All Status</option>
                            <option value="active">Active</option>
                            <option value="completed">Completed</option>
                            <option value="inactive">Inactive</option>
                        </select>

                    </div>

                </div>

            </section>


            <!-- =====================
                 LEARNER TABLE
            ====================== -->
            <section class="learner-table-card">

                <div class="table-wrapper">

                    <table class="learner-table">

                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Student ID</th>
                                <th>Learner</th>
                                <th>Program</th>
                                <th>Modules Assigned</th>
                                <th>Progress</th>
                                <th>Status</th>
                            </tr>
                        </thead>


                        <tbody id="learnerTableBody">
                        </tbody>

                    </table>

                </div>


                <!-- Empty result message -->
                <div
                    class="no-results"
                    id="noResults"
                    hidden
                >
                    <i data-lucide="search-x"></i>

                    <h3>No learners found</h3>

                    <p>
                        Try changing your search or filter.
                    </p>
                </div>

            </section>

        </main>

    </div>


    <script src="../../api-config.js"></script>
    <script src="../js/shared.js"></script>
    <!-- Programs come from the Module Library -->
    <script src="../js/module-library-data.js"></script>
    <script src="../js/program-data.js"></script>
    <script src="../js/learners.js"></script>
    <script src="../js/learner-details.js"></script>
    <script src="../js/module-library.js"></script>

</body>
</html>
