<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <!-- In-page messages and questions instead of the browser's own boxes -->
    <script src="../shared/dialogs.js"></script>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | Siknayan</title>

    <link
        rel="stylesheet"
        href="css/system-admin.css"
    >

    <script
        src="../shared/lucide-icons.js"
    ></script>

    <!-- Header and sidebar: same as the Academic Admin portal -->
    <link rel="stylesheet" href="css/shell.css">

</head>


<body>


    <!-- =====================================================
         TOPBAR
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <img
                src="../images/logo.png"
                alt="MPSU Logo"
                class="brand-logo"
            >

            <div class="brand-text">

                <h1>
                    MPSU ETEEAP LMS
                </h1>

                <p>
                    Mountain Province State University
                </p>

            </div>

        </div>


        <div class="topbar-right">

            <button
                class="icon-button notification-button"
                type="button"
                title="Notifications"
                aria-label="Notifications"
            >

                <i data-lucide="bell"></i>

                <span class="notification-dot"></span>

            </button>


            <a class="profile" href="profile.html" aria-label="Open My Profile" title="My Profile">

                <img
                    src="../images/macross.jpg"
                    alt="Arcana"
                    class="profile-avatar"
                >

                <div class="profile-info">

                    <strong>
                        Arcana
                    </strong>

                    <span>
                        Administrator
                    </span>

                </div>

                <i
                    data-lucide="chevron-down"
                    class="profile-chevron"
                ></i>

            </a>

        </div>

    </header>



    <!-- =====================================================
         APPLICATION LAYOUT
    ====================================================== -->

    <div class="app-layout">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="sidebar-top">

                <span class="sidebar-view-text">
                    View
                </span>

                <button
                    class="sidebar-toggle"
                    id="sidebarToggle"
                    type="button"
                    title="Toggle Sidebar"
                    aria-label="Toggle Sidebar"
                >

                    <i data-lucide="panel-left"></i>

                </button>

            </div>



            <!-- Sidebar Profile -->

            <div class="sidebar-profile">

                <img
                    src="../images/macross.jpg"
                    alt="Arcana"
                    class="sidebar-avatar"
                >

                <div class="sidebar-profile-info">

                    <span class="sidebar-profile-name">
                        Arcana
                    </span>

                </div>

            </div>



            <!-- Navigation -->

            <nav class="sidebar-nav">


                <!-- Dashboard -->

                <a
                    href="./"
                    class="nav-item"
                >

                    <i data-lucide="layout-dashboard"></i>

                    <span class="nav-label">
                        Dashboard
                    </span>

                </a>


                <!-- Academic Administrators -->

                <a
                    href="administrators.html"
                    class="nav-item"
                >

                    <i data-lucide="users"></i>

                    <span class="nav-label">
                        Academic Admins
                    </span>

                </a>


                <!-- Data Backup -->

                <a
                    href="backup.html"
                    class="nav-item"
                >

                    <i data-lucide="database-backup"></i>

                    <span class="nav-label">
                        Data Backup
                    </span>

                </a>


                <!-- Audit Logs -->

                <a
                    href="audit-logs.html"
                    class="nav-item"
                >

                    <i data-lucide="file-clock"></i>

                    <span class="nav-label">
                        Audit Logs
                    </span>

                </a>

            

                <a

                    href="notifications.html"

                    class="nav-item"

                >

                    <i data-lucide="bell"></i>

                    <span class="nav-label">

                        Notifications

                    </span>

                </a>

</nav>



            <!-- Logout -->

            <div class="sidebar-bottom">

                <a
                    href="../index.html"
                    class="nav-item"
                    data-system-admin-logout
                >

                    <i data-lucide="log-out"></i>

                    <span class="nav-label">
                        Logout
                    </span>

                </a>

            </div>

        </aside>



        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <!-- My Profile is a pop-up opened from the name in the header on
             every page (like the other portals). This page is kept for old
             links: it opens the pop-up, and closing it returns to the Dashboard. -->
        <main class="main-content profile-main"></main>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../api-config.js"></script>
    <script src="js/shared.js"></script>
    <!-- My Profile pop-up, same as the other portals -->
    <script src="js/profile-modal.js"></script>
    <script>
        window.siknayanSystemAdminProfileOverlay?.addEventListener("profileclose", () => {
            window.location.replace("./");
        });
    </script>


</body>

</html>
